name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 0.1.0 or 0.2.0-beta.1'
        required: true
        default: '0.1.0'
        type: string
      draft:
        description: 'Create a draft GitHub Release for review'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mystere-atlas-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release request
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Releases must be started from main.' >&2
            exit 1
          fi
          node scripts/package-release.mjs --validate-version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build standalone application
        run: npm run build
        env:
          RELEASE_STANDALONE: '1'
      - run: npm run release:package
      - name: Test the packaged runtime
        run: npm run smoke -- --start-server --standalone=tmp/release/runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            tmp/release/*.tar.gz
            tmp/release/SHA256SUMS
            tmp/release/release-manifest.json
            tmp/release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: release-files
      - name: Verify files and create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS
          TAG="v$RELEASE_VERSION"
          EXISTING=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [ -n "$EXISTING" ]; then
            echo 'This version tag already exists. Choose a new version.' >&2
            exit 1
          fi
          OPTIONS=()
          if [ "$RELEASE_DRAFT" = 'true' ]; then OPTIONS+=(--draft); fi
          URL=$(gh release create "$TAG" ./*.tar.gz SHA256SUMS release-manifest.json \
            --target "$GITHUB_SHA" --title "Mystère Atlas $TAG" \
            --notes-file RELEASE-NOTES.md "${OPTIONS[@]}")
          {
            echo '## Release prepared'
            echo "$URL"
            echo "Source commit: $GITHUB_SHA"
            echo 'This creates a GitHub version package. It does not redeploy the public Sites demo.'
          } >> "$GITHUB_STEP_SUMMARY"
