name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystere-atlas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOY_DATA_SNAPSHOT: '1'
      VERCEL_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require production branch and hosting credentials
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Production deployments must be started from main.' >&2
            exit 1
          fi
          MISSING=0
          for NAME in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Configure repository Actions secret $NAME before deployment."
              MISSING=1
            fi
          done
          if [ "$MISSING" = '1' ]; then
            echo 'No deployment was attempted. See docs/github-deploy.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Fetch public catalog and Paris events
        run: npm run data:sync
      - name: Require a nonempty public data snapshot
        run: node --import tsx scripts/validate-deploy-data.ts
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.0.0
      - name: Load production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build the production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Verify public snapshot is included in server functions
        run: node scripts/check-deploy-traces.mjs
      - name: Verify production build before deployment
        run: npm run smoke -- --start-server
      - name: Deploy the verified build
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          DEPLOYED_URL="$URL" node scripts/check-deployed-url.mjs
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo '## Website deployed'
            echo "$URL"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed website
        run: npm run smoke
        env:
          SMOKE_BASE_URL: ${{ steps.publish.outputs.url }}
